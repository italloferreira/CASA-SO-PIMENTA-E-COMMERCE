<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Só Pimenta / Painel Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
    body { background: #1a1a1a; color: #eee; }
    header { background: #2a2a2a; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #d4a853; }
    header h1 { color: #d4a853; font-size: 1.2rem; }
    header a { color: #e74c3c; text-decoration: none; font-size: 0.9rem; }
    header a:hover { text-decoration: underline; }
    main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
    section { margin-bottom: 2.5rem; background: #2a2a2a; border-radius: 8px; padding: 1.5rem; }
    section h2 { color: #d4a853; margin-bottom: 1rem; font-size: 1.1rem; border-bottom: 1px solid #444; padding-bottom: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 0.5rem; color: #aaa; border-bottom: 1px solid #444; font-weight: normal; }
    td { padding: 0.5rem; border-bottom: 1px solid #333; }
    tr:hover td { background: #333; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-pending { background: #f39c12; color: #1a1a1a; }
    .badge-confirmed { background: #3498db; color: #fff; }
    .badge-shipped { background: #9b59b6; color: #fff; }
    .badge-delivered { background: #2ecc71; color: #1a1a1a; }
    .badge-cancelled { background: #e74c3c; color: #fff; }
    select.status-select { background: #1a1a1a; color: #eee; border: 1px solid #555; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
    .btn-desativar { background: #e74c3c; color: #fff; border: none; padding: 0.25rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .btn-desativar:hover { background: #c0392b; }
    .btn-desativar:disabled { opacity: 0.5; cursor: not-allowed; }
    .loading { text-align: center; padding: 2rem; color: #888; }
    .vazio { text-align: center; padding: 1rem; color: #666; font-style: italic; }
    .sair { color: #e74c3c; }
    .subtexto { font-size: 0.75rem; color: #888; margin-top: 0.2rem; }
  </style>
</head>
<body>
  <header>
    <h1>Painel Administrativo</h1>
    <a href="#" id="btnSair" class="sair">Sair</a>
  </header>

  <main>
    <section id="secao-produtos">
      <h2>Produtos</h2>
      <div id="lista-produtos" class="loading">Carregando produtos...</div>
    </section>

    <section id="secao-pedidos">
      <h2>Pedidos</h2>
      <div id="lista-pedidos" class="loading">Carregando pedidos...</div>
    </section>
  </main>

  <script type="module">
    const API_BASE = 'http://localhost:3333';

    function verificarAutenticacao() {
      const token = localStorage.getItem('csp_admin_token');
      if (!token) {
        window.location.href = '/site/pages/admin/index.html';
        return null;
      }
      return token;
    }

    function apiRequest(method, path, body) {
      const token = verificarAutenticacao();
      const options = {
        method,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        }
      };
      if (body) options.body = JSON.stringify(body);
      return fetch(API_BASE + path, options).then(function (res) {
        if (res.status === 401) {
          localStorage.removeItem('csp_admin_token');
          window.location.href = '/site/pages/admin/index.html';
          throw new Error('Sessão expirada.');
        }
        if (!res.ok) {
          return res.json().then(function (d) { throw new Error(d.message || 'Erro'); });
        }
        return res.json();
      });
    }

    /* ── Produtos ── */
    async function carregarProdutos() {
      const el = document.getElementById('lista-produtos');
      try {
        const produtos = await apiRequest('GET', '/api/products');
        if (produtos.length === 0) {
          el.innerHTML = '<p class="vazio">Nenhum produto cadastrado.</p>';
          return;
        }
        let html = '<table><thead><tr><th>ID</th><th>Nome</th><th>Preço</th><th>Ativo</th><th>Ação</th></tr></thead><tbody>';
        produtos.forEach(function (p) {
          const preco = Number(p.price).toFixed(2).replace('.', ',');
          html += '<tr><td>' + p.id + '</td><td>' + p.name + '<div class="subtexto">' + (p.category_name || '') + '</div></td><td>R$ ' + preco + '</td><td>' + (p.is_active ? 'Sim' : 'Não') + '</td><td><button class="btn-desativar" data-id="' + p.id + '">Desativar</button></td></tr>';
        });
        html += '</tbody></table>';
        el.innerHTML = html;

        el.querySelectorAll('.btn-desativar').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            const id = this.dataset.id;
            this.disabled = true;
            this.textContent = '...';
            try {
              await apiRequest('DELETE', '/api/products/' + id);
              carregarProdutos();
            } catch (err) {
              alert(err.message);
              this.disabled = false;
              this.textContent = 'Desativar';
            }
          });
        });
      } catch (err) {
        el.innerHTML = '<p class="vazio">Erro ao carregar produtos: ' + err.message + '</p>';
      }
    }

    /* ── Pedidos ── */
    const STATUS_MAP = {
      pending: 'Pendente',
      confirmed: 'Confirmado',
      shipped: 'Enviado',
      delivered: 'Entregue',
      cancelled: 'Cancelado'
    };

    async function carregarPedidos() {
      const el = document.getElementById('lista-pedidos');
      try {
        const pedidos = await apiRequest('GET', '/api/orders');
        if (pedidos.length === 0) {
          el.innerHTML = '<p class="vazio">Nenhum pedido encontrado.</p>';
          return;
        }
        let html = '<table><thead><tr><th>#</th><th>Cliente</th><th>Total</th><th>Status</th><th>Data</th></tr></thead><tbody>';
        pedidos.forEach(function (o) {
          const total = Number(o.total).toFixed(2).replace('.', ',');
          const data = new Date(o.created_at).toLocaleDateString('pt-BR');
          const statusLabel = STATUS_MAP[o.status] || o.status;
          const badgeClass = 'badge-' + o.status;
          html += '<tr><td>' + o.id + '</td><td>' + o.customer_name + '<div class="subtexto">' + o.customer_email + '</div></td><td>R$ ' + total + '</td><td><select class="status-select" data-id="' + o.id + '">';
          Object.keys(STATUS_MAP).forEach(function (s) {
            html += '<option value="' + s + '"' + (s === o.status ? ' selected' : '') + '>' + STATUS_MAP[s] + '</option>';
          });
          html += '</select></td><td>' + data + '</td></tr>';
        });
        html += '</tbody></table>';
        el.innerHTML = html;

        el.querySelectorAll('.status-select').forEach(function (select) {
          select.addEventListener('change', async function () {
            const id = this.dataset.id;
            const status = this.value;
            this.disabled = true;
            try {
              await apiRequest('PATCH', '/api/orders/' + id + '/status', { status });
            } catch (err) {
              alert(err.message);
            }
            this.disabled = false;
          });
        });
      } catch (err) {
        el.innerHTML = '<p class="vazio">Erro ao carregar pedidos: ' + err.message + '</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      verificarAutenticacao();
      carregarProdutos();
      carregarPedidos();

      document.getElementById('btnSair').addEventListener('click', function (e) {
        e.preventDefault();
        localStorage.removeItem('csp_admin_token');
        window.location.href = '/site/pages/admin/index.html';
      });
    });
  </script>
</body>
</html>
